name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install scripts are skipped: linting and type checking need no native builds.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # The full project is built with ts-loader's transpileOnly and does not
      # type check, so only the translation module is checked.
      - run: npx tsc -p tsconfig.i18n.json
